apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: station-reservation-service
  labels: {app: station-reservation-service, tier: backend}
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: station-reservation-service}
  template:
    metadata:
      labels: {app: station-reservation-service, tier: backend}
    spec:
      containers:
        - name: app
          image: aegisvolt/station-reservation-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: aegisvolt-config}
            - secretRef: {name: aegisvolt-aws}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_TEMPLATE_HASH
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['rollouts-pod-template-hash']"}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
  strategy:
    canary:
      canaryService: station-reservation-service-canary
      stableService: station-reservation-service-stable
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: {duration: 10s}
        - analysis:
            templates:
              - templateName: canary-health
            args:
              - name: service-name
                value: station-reservation-service
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 60
        - pause: {duration: 10s}
---
apiVersion: v1
kind: Service
metadata:
  name: station-reservation-service
  labels: {app: station-reservation-service}
spec:
  selector: {app: station-reservation-service}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: station-reservation-service-stable
  labels: {app: station-reservation-service, track: stable}
spec:
  selector: {app: station-reservation-service}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: station-reservation-service-canary
  labels: {app: station-reservation-service, track: canary}
spec:
  selector: {app: station-reservation-service}
  ports: [{name: http, port: 8000, targetPort: http}]
