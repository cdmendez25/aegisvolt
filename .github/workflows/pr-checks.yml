name: pr-checks

on:
  pull_request:
    branches: [dev, test, prod]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  UV_PYTHON: "3.13"

jobs:
  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-latest
    steps:
      - name: Validar flujo de promoción
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            dev)  [[ "$HEAD" =~ ^(feature|fix|chore|docs)/.+ ]] || { echo "::error::A dev solo entran ramas feature/*, fix/*, chore/*, docs/*"; exit 1; } ;;
            test) [[ "$HEAD" == "dev"  ]] || { echo "::error::A test solo se promueve desde dev (recibido: $HEAD)"; exit 1; } ;;
            prod) [[ "$HEAD" == "test" ]] || { echo "::error::A prod solo se promueve desde test (recibido: $HEAD)"; exit 1; } ;;
          esac
          echo "Promoción válida ✅"

  lint-build:
    name: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - name: Ruff (lint + formato)
        run: |
          uv run ruff check services tests scripts observability
          uv run ruff format --check services tests
      - name: Validar y exportar esquema GraphQL
        run: |
          PYTHONPATH=services ENV=ci uv run python -c "
          from graphql_gateway.schema import schema
          sdl = schema.as_str()
          assert 'reserveAndStartCharging' in sdl and 'type Subscription' in sdl
          open('schema.graphql','w').write(sdl)
          print(f'Esquema GraphQL válido: {len(sdl.splitlines())} líneas')"
      - uses: actions/upload-artifact@v4
        with: {name: graphql-schema, path: schema.graphql}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Frontend (type-check + build)
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build de imágenes Docker
        run: ./scripts/build-images.sh ${GITHUB_SHA::7}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/live init -backend=false -input=false
          for ws in dev test prod; do TF_WORKSPACE=$ws terraform -chdir=infra/live validate; done

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run pytest tests/unit -v --junitxml=unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: unit-tests, path: unit.xml}

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - name: Esperar Floci
        run: timeout 60 bash -c 'until curl -sf http://localhost:4566/_floci/health; do sleep 2; done'
      - run: uv run pytest tests/integration -m integration -v --junitxml=integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integration-tests, path: integration.xml}

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    needs: [lint-build, unit-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_wrapper: false}
      - run: uv sync --group dev
      - name: Infra efímera (Floci + bootstrap S3 + workspace dev)
        run: |
          ./scripts/floci-up.sh
          terraform -chdir=infra/bootstrap init -input=false && terraform -chdir=infra/bootstrap apply -auto-approve -input=false
          terraform -chdir=infra/live init -input=false
          terraform -chdir=infra/live workspace select -or-create dev
          terraform -chdir=infra/live apply -auto-approve -input=false
      - name: Clúster kind + ingress + Argo Rollouts
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/cluster-up.sh
      - name: Build + despliegue del PR en el clúster efímero
        run: |
          ./scripts/build-images.sh ${GITHUB_SHA::7}
          ./scripts/deploy.sh dev ${GITHUB_SHA::7}
      - name: E2E (frontend + GraphQL + SAGA + DynamoDB + API Gateway)
        run: |
          echo "127.0.0.1 dev.aegisvolt.localhost" | sudo tee -a /etc/hosts
          export APIGW_URL="$(terraform -chdir=infra/live output -raw api_gateway_invoke_url)"
          E2E_ENV=dev E2E_MODE=full uv run pytest tests/e2e -m e2e -v --junitxml=e2e.xml
      - name: Diagnóstico si falla
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n aegisvolt-dev get rollouts.argoproj.io,analysisruns.argoproj.io || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: e2e-tests, path: e2e.xml}

  terraform-plan:
    name: terraform-plan
    runs-on: [self-hosted, aegisvolt]
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar workspace = rama destino del PR
        id: ws
        run: |
          WS="${{ github.base_ref }}"
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          terraform -chdir=infra/live init -input=false
          terraform -chdir=infra/live workspace select "$WS"
          echo "Workspace activo: $(terraform -chdir=infra/live workspace show)"
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir=infra/live plan -input=false -no-color -lock-timeout=60s \
            -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [[ $code -eq 1 ]] && exit 1 || exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.ws.outputs.workspace }}
          path: |
            infra/live/tfplan
            plan.txt
      - name: Publicar el plan en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(ver log)'])[0];
            const body = `### terraform plan · workspace \`${{ steps.ws.outputs.workspace }}\`\n` +
              `**${summary}**\n<details><summary>Plan completo</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
